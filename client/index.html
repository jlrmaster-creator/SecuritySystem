<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SecureChat" />
  <meta name="description" content="Mensajería privada cifrada extremo a extremo. Solo por invitación." />

  <title>SecureChat — Mensajería Privada E2EE</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- libsodium (E2EE) -->
  <script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/modules/libsodium-wrappers.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Splash / Loading -->
  <div id="splash" class="splash">
    <div class="splash-logo">
      <svg class="splash-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="20" width="48" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M20 20V16a12 12 0 0124 0v4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="32" cy="36" r="4" fill="currentColor"/>
        <path d="M32 40v6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="splash-title">SecureChat</span>
    </div>
    <p class="splash-sub">Inicializando sistema de cifrado…</p>
    <div class="splash-bar"><div class="splash-bar-fill" id="splashBarFill"></div></div>
  </div>

  <!-- App Root -->
  <div id="app" class="app hidden">
    <!-- Top Navigation Bar -->
    <header id="appHeader" class="app-header hidden">
      <button id="btnBack" class="btn-icon btn-back hidden" aria-label="Volver">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="appTitle" class="app-title">SecureChat</h1>
      <div id="headerActions" class="header-actions"></div>
    </header>

    <!-- Screen Container -->
    <main id="screenContainer" class="screen-container"></main>

    <!-- Bottom Navigation -->
    <nav id="bottomNav" class="bottom-nav hidden">
      <button class="nav-item active" data-screen="chats" id="navChats">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Chats</span>
      </button>
      <button class="nav-item" data-screen="requests" id="navRequests">
        <svg viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Solicitudes</span>
        <span class="badge hidden" id="requestsBadge">0</span>
      </button>
      <button class="nav-item" data-screen="security" id="navSecurity">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Seguridad</span>
      </button>
    </nav>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- Modal -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modalTitle" class="modal-title"></h2>
      <p id="modalBody" class="modal-body"></p>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/crypto.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/identity.js"></script>
  <script src="js/websocket.js"></script>
  <script src="js/ui/screen-invite.js"></script>
  <script src="js/ui/screen-verify.js"></script>
  <script src="js/ui/screen-chats.js"></script>
  <script src="js/ui/screen-chat.js"></script>
  <script src="js/ui/screen-new-contact.js"></script>
  <script src="js/ui/screen-requests.js"></script>
  <script src="js/ui/screen-security.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
